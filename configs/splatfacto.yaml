dataset:
  name: zavod70
  smoke_colmap_path: artifacts/colmap/smoke/zavod70-smoke
  full_colmap_path: artifacts/colmap/full/zavod70
  images_path: .
  reconstruction_path: .

training:
  method: splatfacto
  max_iterations: 30000
  smoke_iterations: 3000
  output_dir: artifacts/splatfacto
  experiment_name: zavod70
  full_low_vram:
    cache_images: cpu
    stop_split_at: 6000
    viewer_rays_per_chunk: 8192
    pytorch_cuda_alloc_conf: max_split_size_mb:128

render:
  camera_path: configs/camera_path.json
  output: renders/zavod70-demo.mp4
  dataset_path:
    keyframe_stride: 1
    transition_seconds: 1.0
    fps: 30
    resolution: [1280, 960]
    viewport_max_resolution: 2048
    crop:
      center: [0.0, 0.0, 0.0]
      scale: [2.5, 1.94, 1.0]
      rotation: [0.0, 0.0, 0.0]
      background_rgb: [36, 36, 36]
